# =============================================================================
# WebGoat • Frogbot workflow
#
# Killchain steps 4 (Remediate) and 5 (Verify):
#   - On push to main + nightly: scan repo, open Smart-Remediation PRs bumping
#     vulnerable dependency versions to a Curation-approved candidate.
#   - On PR events: re-scan the PR and comment findings so reviewers see
#     what the merge introduces (or, for Frogbot's own fix-PRs, that the CVE
#     is now absent -- Step 5 Verify).
#
# Frogbot doc: https://docs.jfrog.com/jfrog-applications/frogbot
# =============================================================================

name: WebGoat • Frogbot (Remediate + Verify)

on:
  push:
    branches: [ main ]
  pull_request_target:
    types: [ opened, synchronize ]
  schedule:
    - cron: '0 6 * * *'   # daily nightly scan for newly-disclosed CVEs
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:

  # -------------------------------------------------------------------------
  # Remediate: open PRs bumping vulnerable deps to fix versions.
  # Runs on push-to-main + schedule (not on PRs, to avoid recursion).
  # -------------------------------------------------------------------------
  create-fix-prs:
    name: "4 • Remediate (Smart Remediation PRs)"
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: jfrog/frogbot@v2
        env:
          JF_URL:               ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN:      ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_PROVIDER:      github
          JF_GIT_OWNER:         ${{ github.repository_owner }}
          JF_GIT_REPO:          ${{ github.event.repository.name }}
          JF_GIT_BASE_BRANCH:   main
          JF_INSTALL_DEPS_CMD:  "mvn dependency:resolve -q"

  # -------------------------------------------------------------------------
  # Scan the PR + comment findings. Runs on any PR against main -- including
  # Frogbot's own fix-PRs, which is how Step 5 (Verify) demonstrates:
  # the same scanner confirms the CVE is gone on the fix branch.
  # -------------------------------------------------------------------------
  scan-pull-request:
    name: "5 • Verify (Scan PR + Comment)"
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    # The frogbot environment can be configured with required reviewers to
    # gate scan runs on untrusted PRs -- recommended for public forks.
    environment: frogbot
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: jfrog/frogbot@v2
        env:
          JF_URL:              ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN:     ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_PROVIDER:     github
          JF_GIT_OWNER:        ${{ github.repository_owner }}
          JF_INSTALL_DEPS_CMD: "mvn dependency:resolve -q"
